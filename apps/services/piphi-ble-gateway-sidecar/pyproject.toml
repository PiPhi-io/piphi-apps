[project]
name = "piphi-ble-gateway-sidecar"
version = "0.4.0"
description = "Cross-platform, privacy-preserving BLE observation gateway for PiPhi."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.11.1,<1.0.0",
  "bleak>=2.0.0,<3.0.0",
  "cryptography>=50.0.0,<51.0.0",
  "dbus-fast>=5.0.0,<6.0.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "piphi-runtime-testkit-python>=0.1.4,<0.2.0",
  "pip-audit>=2.9.0,<3.0.0",
]


[project.scripts]
piphi_ble_gateway_sidecar = "piphi_ble_gateway_sidecar.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_ble_gateway_sidecar"]
