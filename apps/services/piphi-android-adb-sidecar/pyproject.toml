[project]
name = "piphi-android-adb-sidecar"
version = "0.3.0-rc.2"
description = "Piphi Android Adb Sidecar PiPhi sidecar runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python==0.8.1",
  "pydantic<3,>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "piphi-runtime-testkit-python>=0.1.4,<0.2.0",
    "ruff<1,>=0.14",
    "mypy<2,>=1.18",
    "pytest-cov<8,>=6",
]


[project.scripts]
piphi_android_adb_sidecar = "piphi_android_adb_sidecar.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_android_adb_sidecar"]
