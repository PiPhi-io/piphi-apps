[project]
name = "piphi-rtl433-bridge"
version = "0.2.1"
description = "Bounded receive-only rtl_433 bridge for PiPhi Network"
authors = [
    { name = "PiPhi Network" },
    {name = "KelvinSan", email = "kelvin.sanyaolu@gmail.com"},
]
dependencies = [
    "aiomqtt>=2.4,<3.0",
    "click>=8.1.0",
    "fastapi>=0.116.1",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.35,<1.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }

[tool.pdm.dev-dependencies]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.18.2",
    "pip-audit>=2.9.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
bridge = "python -m piphi_rtl433_bridge"
test = "pytest"

[tool.setuptools.packages.find]
where = ["src"]
