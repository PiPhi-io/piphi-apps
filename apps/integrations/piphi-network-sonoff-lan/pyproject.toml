[project]
name = "piphi-network-sonoff-lan"
version = "0.2.0"
description = "Piphi Network Sonoff Lan PiPhi integration runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.11.1,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "pytest>=8.0.0",
  "pytest-cov>=7.0.0",
  "httpx>=0.27.0",
  "mypy>=1.18.2",
  "pip-audit>=2.9.0",
  "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true


[project.scripts]
piphi_network_sonoff_lan = "piphi_network_sonoff_lan.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_sonoff_lan"]
