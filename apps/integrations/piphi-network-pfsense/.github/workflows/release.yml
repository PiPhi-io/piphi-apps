name: Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing semantic-version release tag (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/piphinetwork/piphi-network-pfsense
  RELEASE_REF: ${{ inputs.release_ref }}

jobs:
  release:
    name: Verify, publish, and release
    runs-on: [self-hosted, Linux, X64, self-hosted-machine-1]
    permissions:
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install PDM
        run: python -m pip install --disable-pip-version-check pdm

      - name: Install locked development dependencies
        run: pdm install -G dev --frozen-lockfile

      - name: Validate release versions
        run: pdm run python scripts/check_release.py "${RELEASE_REF}"

      - name: Run backend verification
        run: |
          pdm run pytest
          pdm run ruff check src tests
          pdm run ruff format --check src tests
          pdm run mypy --strict src
          pdm run python scripts/validate.py

      - name: Verify widgets
        run: |
          for widget in pfsense-overview pfsense-client-security; do
            npm ci --ignore-scripts --prefix "widgets/${widget}"
            npm audit --omit=dev --prefix "widgets/${widget}"
            npm test --prefix "widgets/${widget}"
            npm run validate --prefix "widgets/${widget}"
            npm run conformance --prefix "widgets/${widget}"
          done

      - name: Build Python distributions
        run: pdm build

      - name: Assemble release assets
        run: |
          VERSION="${RELEASE_REF#v}"
          mkdir -p release
          cp dist/* release/
          tar \
            --exclude='*/node_modules' \
            --exclude='*/.gitignore' \
            -czf "release/piphi-network-pfsense-${VERSION}.tar.gz" \
            manifest.json schema src widgets Dockerfile pyproject.toml pdm.lock README.md docs examples
          cd release
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub with organization token
        uses: docker/login-action@v4
        with:
          username: piphinetwork
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_REF }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_REF }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_REF, '-') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attest container image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          name: PiPhi Network pfSense ${{ env.RELEASE_REF }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
