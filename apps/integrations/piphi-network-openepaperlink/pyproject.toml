[project]
name = "piphi-network-openepaperlink"
version = "0.1.1"
description = "Piphi Network Openepaperlink PiPhi integration runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.8.1,<1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "bandit>=1.7.10",
  "piphi-runtime-testkit-python>=0.2.0,<1.0.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true


[project.scripts]
piphi_network_openepaperlink = "piphi_network_openepaperlink.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_openepaperlink"]
