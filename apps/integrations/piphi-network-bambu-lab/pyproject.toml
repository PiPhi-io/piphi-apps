[project]
name = "piphi-network-bambu-lab"
version = "0.1.1"
description = "Piphi Network Bambu Lab PiPhi integration runtime."
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.135,<1.0",
  "uvicorn[standard]>=0.40,<1.0",
  "piphi-runtime-kit-python>=0.11.1,<1.0.0",
  "paho-mqtt>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "httpx>=0.28,<1.0",
  "mypy>=1.18.2",
  "pip-audit>=2.9.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.2,<2.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13,<1.0",
]


[project.scripts]
piphi_network_bambu_lab = "piphi_network_bambu_lab.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_bambu_lab"]

[tool.hatch.build.targets.wheel.force-include]
"src/behaviors.json" = "piphi_network_bambu_lab/behaviors.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
