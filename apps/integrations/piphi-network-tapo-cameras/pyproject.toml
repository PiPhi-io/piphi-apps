[project]
name = "piphi-network-tapo-cameras"
version = "0.2.0"
description = "Read-only authenticated local Tapo camera monitoring for PiPhi Network."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.8.1,<1.0.0",
  "python-kasa>=0.10.2,<0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0,<5.0.0",
  "ruff>=0.8.0,<1.0.0",
]


[project.scripts]
piphi_network_tapo_cameras = "piphi_network_tapo_cameras.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_tapo_cameras"]
