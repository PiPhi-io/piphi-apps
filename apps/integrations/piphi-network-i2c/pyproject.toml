[project]
name = "piphi-network-i2c"
version = "0.1.4"
description = "PiPhi integration runtime for local I2C environmental sensors."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "piphi-runtime-kit-python>=0.8.1,<1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
hardware = [
  "smbus2==0.6.1",
  "bme680==2.0.0",
  "pimoroni-bme280==1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pip-audit>=2.9.0",
  "ruff>=0.8.0",
]

[project.scripts]
piphi_network_i2c = "piphi_network_i2c.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_i2c"]

[tool.hatch.build.targets.wheel.force-include]
"src/manifest.json" = "piphi_network_i2c/manifest.json"
"src/behaviors.json" = "piphi_network_i2c/behaviors.json"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "EXE001"]
