[project]
name = "piphi-network-plex"
version = "0.2.0"
description = "Piphi Network Plex PiPhi integration runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.30.0",
  "defusedxml>=0.7.1,<1.0.0",
  "piphi-runtime-kit-python>=0.11.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "mypy>=1.18.2",
  "pip-audit>=2.9.0",
  "piphi-runtime-testkit-python>=0.2.0,<1.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
  "types-defusedxml>=0.7.0.20250822",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true


[project.scripts]
piphi_network_plex = "piphi_network_plex.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_plex"]

[tool.hatch.build.targets.wheel.force-include]
"src/behaviors.json" = "piphi_network_plex/behaviors.json"
