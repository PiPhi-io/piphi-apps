[project]
name = "piphi-network-passive-ble-monitor"
version = "0.4.0"
description = "Managed-gateway BTHome v2 observation consumer for PiPhi Network."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.11.1,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pip-audit>=2.7.0",
  "piphi-runtime-testkit-python>=0.1.4,<0.2.0",
]


[project.scripts]
piphi_network_passive_ble_monitor = "piphi_network_passive_ble_monitor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_passive_ble_monitor"]
