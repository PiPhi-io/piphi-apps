[project]
name = "piphi-network-awair-element"
version = "0.1.15"
description = "Read-only PiPhi runtime for Awair Element's local HTTP API."
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
  "fastapi>=0.135,<1.0",
  "httpx>=0.28,<1.0",
  "piphi-runtime-kit-python>=0.11.1,<1.0.0",
  "uvicorn[standard]>=0.40,<1.0",
  "zeroconf>=0.151,<1.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "mypy>=1.18.2",
  "pip-audit>=2.9.0",
  "piphi-runtime-testkit-python>=0.2.0,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/com_piphi_await_element"]

[tool.hatch.build.targets.wheel.force-include]
"src/manifest.json" = "com_piphi_await_element/manifest.json"
"src/behaviors.json" = "com_piphi_await_element/behaviors.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
