[project]
name = "piphi-network-bacnet"
version = "0.1.2"
description = "Piphi Network Bacnet PiPhi integration runtime."
requires-python = ">=3.11"
dependencies = [
  "bacpypes3==0.0.110",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.8.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]


[project.scripts]
piphi_network_bacnet = "piphi_network_bacnet.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_bacnet"]

[tool.hatch.build.targets.wheel.force-include]
"src/behaviors.json" = "piphi_network_bacnet/behaviors.json"
