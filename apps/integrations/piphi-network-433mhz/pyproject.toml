[project]
name = "piphi-network-433mhz"
version = "0.2.1"
description = "Receive-only PiPhi integration for a bounded rtl_433 sensor slice"
authors = [
    { name = "PiPhi Network" },
    {name = "KelvinSan", email = "kelvin.sanyaolu@gmail.com"},
]
dependencies = [
    "fastapi[standard]>=0.116.1",
    "piphi-runtime-kit-python[fastapi,mqtt]>=0.11.1,<1.0.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "bandit>=1.9.4",
    "mypy>=1.18.2",
    "pip-audit>=2.9.0",
    "piphi-runtime-testkit-python>=0.2.0,<1.0.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "uvicorn piphi_network_433mhz.app:app --host 0.0.0.0 --port 8090 --reload"
release-version = "python scripts/release.py"
release-github = "python scripts/create_github_release.py"
test = "pytest"
