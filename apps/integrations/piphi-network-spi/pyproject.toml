[project]
name = "piphi-network-spi"
version = "0.1.4"
description = "PiPhi integration runtime for local SPI environmental sensors."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "piphi-runtime-kit-python>=0.8.1,<1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pip-audit>=2.9.0",
  "ruff>=0.8.0",
]

[project.scripts]
piphi_network_spi = "piphi_network_spi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_spi"]

[tool.hatch.build.targets.wheel.force-include]
"src/manifest.json" = "piphi_network_spi/manifest.json"
"src/behaviors.json" = "piphi_network_spi/behaviors.json"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "EXE001"]
