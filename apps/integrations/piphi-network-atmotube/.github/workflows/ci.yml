name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: python3 -m json.tool src/manifest.json >/dev/null
      - run: python3 -m json.tool src/behaviors.json >/dev/null
