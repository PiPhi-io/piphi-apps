[project]
name = "piphi-network-knx"
version = "0.2.3"
description = "Bounded, typed KNX/IP integration runtime for PiPhi Network."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.8.1,<1.0.0",
  "xknx==4.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pytest-cov>=6.0.0,<8.0.0",
  "ruff>=0.14.0,<1.0.0",
  "mypy>=1.18.0,<2.0.0",
]

[tool.pytest.ini_options]
addopts = "--cov=piphi_network_knx --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["piphi_network_knx"]


[project.scripts]
piphi_network_knx = "piphi_network_knx.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_knx"]
