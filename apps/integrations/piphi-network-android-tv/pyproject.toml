[project]
name = "piphi-network-android-tv"
version = "0.3.0-rc.1"
description = "Piphi Network Android Tv PiPhi integration runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python==0.8.1",
  "androidtvremote2==0.3.3",
  "zeroconf<1,>=0.148",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff<1,>=0.14",
    "mypy<2,>=1.18",
    "piphi-runtime-testkit-python<0.2.0,>=0.1.4",
    "pytest-cov<8,>=6",
]


[project.scripts]
piphi_network_android_tv = "piphi_network_android_tv.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_android_tv"]
