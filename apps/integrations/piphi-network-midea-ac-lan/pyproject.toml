[project]
name = "piphi-network-midea-ac-lan"
version = "0.3.1"
description = "Piphi Network Midea Ac Lan PiPhi integration runtime."
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.135,<1.0",
  "uvicorn[standard]>=0.40,<1.0",
  "piphi-runtime-kit-python>=0.11.1,<1.0.0",
  "msmart-ng>=2026.9.0,<2027.0.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "httpx>=0.28,<1.0",
  "mypy>=1.18.2",
  "pip-audit>=2.9.0",
  "piphi-runtime-testkit-python>=0.2.0,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13,<1.0",
]


[project.scripts]
piphi_network_midea_ac_lan = "piphi_network_midea_ac_lan.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_midea_ac_lan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
