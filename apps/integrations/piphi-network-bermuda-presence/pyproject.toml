[project]
name = "piphi-network-bermuda-presence"
version = "0.2.0"
description = "Piphi Network Bermuda Presence PiPhi integration runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.8.1,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src/piphi_network_bermuda_presence/gateway.py",
  "src/piphi_network_bermuda_presence/inference.py",
  "src/piphi_network_bermuda_presence/coordinator.py",
  "src/piphi_network_bermuda_presence/schemas.py",
]


[project.scripts]
piphi_network_bermuda_presence = "piphi_network_bermuda_presence.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_bermuda_presence"]
