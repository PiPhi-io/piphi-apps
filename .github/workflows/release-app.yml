name: Release one app package

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: Exact package ID from piphi-app.json
        required: true
        type: string
      version:
        description: Exact semantic version already committed to the manifest
        required: true
        type: string
      publish:
        description: Push artifacts and create a release
        required: true
        default: false
        type: boolean
      external_digest:
        description: Required sha256 digest for an externally published OCI image
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.package_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      app_path: ${{ steps.plan.outputs.app_path }}
      package_id: ${{ steps.plan.outputs.package_id }}
      version: ${{ steps.plan.outputs.version }}
      artifact_kind: ${{ steps.plan.outputs.artifact_kind }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      environment: ${{ steps.plan.outputs.environment }}
      registry: ${{ steps.plan.outputs.registry }}
      repository: ${{ steps.plan.outputs.repository }}
      image: ${{ steps.plan.outputs.image }}
      publishing_mode: ${{ steps.plan.outputs.publishing_mode }}
      ghcr_required: ${{ steps.plan.outputs.ghcr_required }}
      tags: ${{ steps.plan.outputs.tags }}
      dockerfile: ${{ steps.plan.outputs.dockerfile }}
      context: ${{ steps.plan.outputs.context }}
      platforms: ${{ steps.plan.outputs.platforms }}
      manifest: ${{ steps.plan.outputs.manifest }}
      output: ${{ steps.plan.outputs.output }}
      python_wheel: ${{ steps.plan.outputs.python_wheel }}
      python: ${{ steps.plan.outputs.python }}
      node: ${{ steps.plan.outputs.node }}
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
      java: ${{ steps.plan.outputs.java }}
      dotnet: ${{ steps.plan.outputs.dotnet }}
      ruby: ${{ steps.plan.outputs.ruby }}
      php: ${{ steps.plan.outputs.php }}
      python_version: ${{ steps.plan.outputs.python_version }}
      node_version: ${{ steps.plan.outputs.node_version }}
      go_version: ${{ steps.plan.outputs.go_version }}
      java_version: ${{ steps.plan.outputs.java_version }}
      dotnet_version: ${{ steps.plan.outputs.dotnet_version }}
      ruby_version: ${{ steps.plan.outputs.ruby_version }}
      php_version: ${{ steps.plan.outputs.php_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: >-
          python scripts/release_plan.py
          --package "${{ inputs.package_id }}"
          --version "${{ inputs.version }}"
      - name: Require the protected default branch
        run: test '${{ github.ref }}' = 'refs/heads/main'
      - name: Ensure release tag does not exist
        run: test -z "$(git tag --list '${{ steps.plan.outputs.tag }}')"

  qualify:
    needs: plan
    uses: ./.github/workflows/reusable-app-ci.yml
    with:
      app_path: ${{ needs.plan.outputs.app_path }}
      python: ${{ needs.plan.outputs.python == 'true' }}
      node: ${{ needs.plan.outputs.node == 'true' }}
      go: ${{ needs.plan.outputs.go == 'true' }}
      rust: ${{ needs.plan.outputs.rust == 'true' }}
      java: ${{ needs.plan.outputs.java == 'true' }}
      dotnet: ${{ needs.plan.outputs.dotnet == 'true' }}
      ruby: ${{ needs.plan.outputs.ruby == 'true' }}
      php: ${{ needs.plan.outputs.php == 'true' }}
      python_version: ${{ needs.plan.outputs.python_version }}
      node_version: ${{ needs.plan.outputs.node_version }}
      go_version: ${{ needs.plan.outputs.go_version }}
      java_version: ${{ needs.plan.outputs.java_version }}
      dotnet_version: ${{ needs.plan.outputs.dotnet_version }}
      ruby_version: ${{ needs.plan.outputs.ruby_version }}
      php_version: ${{ needs.plan.outputs.php_version }}
      build_container: false

  publish-oci:
    needs: [plan, qualify]
    if: needs.plan.outputs.artifact_kind == 'oci' && needs.plan.outputs.publishing_mode == 'piphi_managed'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.python_wheel == 'true'
        with:
          python-version: ${{ needs.plan.outputs.python_version }}
      - name: Prepare BACnet qualification Python
        if: needs.plan.outputs.package_id == 'piphi-network-bacnet' || needs.plan.outputs.package_id == 'airthings-consumer-cloud-api' || needs.plan.outputs.package_id == 'piphi-network-sense'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.plan.outputs.python_version }}
      - name: Prepare Python wheel tooling
        if: needs.plan.outputs.python_wheel == 'true'
        run: python -m pip install "pdm==2.29.7"
      - name: Install BACnet qualification dependencies
        if: needs.plan.outputs.package_id == 'piphi-network-bacnet' || needs.plan.outputs.package_id == 'airthings-consumer-cloud-api' || needs.plan.outputs.package_id == 'piphi-network-sense'
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: |
          python -m pip install "pdm==2.29.7"
          pdm install --check
      - name: Build and qualify BACnet release candidate
        if: needs.plan.outputs.package_id == 'piphi-network-bacnet'
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: |
          docker build --tag piphi-network-bacnet:release-candidate \
            --build-arg RELEASE_VERSION='${{ needs.plan.outputs.version }}' \
            --build-arg SOURCE_REVISION='${{ github.sha }}' \
            --build-arg SOURCE_REPOSITORY='https://github.com/PiPhi-io/piphi-apps' .
          pdm run python scripts/qualify_release_image.py \
            --image piphi-network-bacnet:release-candidate \
            --version '${{ needs.plan.outputs.version }}' \
            --revision '${{ github.sha }}'
      - name: Compute source contract digests
        id: contracts
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: |
          echo "manifest_sha256=$(sha256sum '${{ needs.plan.outputs.manifest }}' | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if [[ -f src/behaviors.json ]]; then
            echo "behaviors_sha256=$(sha256sum src/behaviors.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "behaviors_sha256=not-applicable" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and qualify Airthings release candidate
        if: needs.plan.outputs.package_id == 'airthings-consumer-cloud-api'
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: |
          docker build --tag airthings-consumer-cloud-api:release-candidate \
            --build-arg RELEASE_VERSION='${{ needs.plan.outputs.version }}' \
            --build-arg SOURCE_REVISION='${{ github.sha }}' \
            --build-arg SOURCE_REPOSITORY='https://github.com/PiPhi-io/piphi-apps' \
            --build-arg MANIFEST_SHA256='${{ steps.contracts.outputs.manifest_sha256 }}' \
            --build-arg BEHAVIORS_SHA256='${{ steps.contracts.outputs.behaviors_sha256 }}' .
          pdm run python scripts/qualify_release_image.py \
            --image airthings-consumer-cloud-api:release-candidate \
            --version '${{ needs.plan.outputs.version }}' \
            --revision '${{ github.sha }}' \
            --manifest-sha256 '${{ steps.contracts.outputs.manifest_sha256 }}' \
            --behaviors-sha256 '${{ steps.contracts.outputs.behaviors_sha256 }}'
      - name: Build and qualify Sense release candidate
        if: needs.plan.outputs.package_id == 'piphi-network-sense'
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: |
          docker build --tag piphi-network-sense:release-candidate \
            --build-arg RELEASE_VERSION='${{ needs.plan.outputs.version }}' \
            --build-arg SOURCE_REVISION='${{ github.sha }}' \
            --build-arg SOURCE_REPOSITORY='https://github.com/PiPhi-io/piphi-apps' \
            --build-arg MANIFEST_SHA256='${{ steps.contracts.outputs.manifest_sha256 }}' \
            --build-arg BEHAVIORS_SHA256='${{ steps.contracts.outputs.behaviors_sha256 }}' .
          pdm run python scripts/qualify_release_image.py \
            --image piphi-network-sense:release-candidate \
            --version '${{ needs.plan.outputs.version }}' \
            --revision '${{ github.sha }}' \
            --manifest-sha256 '${{ steps.contracts.outputs.manifest_sha256 }}' \
            --behaviors-sha256 '${{ steps.contracts.outputs.behaviors_sha256 }}'
      - name: Log in to GHCR
        if: needs.plan.outputs.ghcr_required == 'true' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to configured OCI registry
        if: needs.plan.outputs.registry != 'ghcr.io' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.plan.outputs.registry }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_TOKEN }}
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ needs.plan.outputs.app_path }}/${{ needs.plan.outputs.context }}
          file: ${{ needs.plan.outputs.app_path }}/${{ needs.plan.outputs.dockerfile }}
          platforms: ${{ needs.plan.outputs.platforms }}
          push: ${{ inputs.publish }}
          tags: ${{ needs.plan.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ needs.plan.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_REPOSITORY=https://github.com/PiPhi-io/piphi-apps
            MANIFEST_SHA256=${{ steps.contracts.outputs.manifest_sha256 }}
            BEHAVIORS_SHA256=${{ steps.contracts.outputs.behaviors_sha256 }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ needs.plan.outputs.package_id }}
          cache-to: type=gha,mode=max,scope=${{ needs.plan.outputs.package_id }}
      - name: Qualify immutable published BACnet image
        if: needs.plan.outputs.package_id == 'piphi-network-bacnet' && inputs.publish
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: >-
          pdm run python scripts/qualify_release_image.py
          --image '${{ needs.plan.outputs.image }}@${{ steps.build.outputs.digest }}'
          --version '${{ needs.plan.outputs.version }}'
          --revision '${{ github.sha }}'
      - name: Qualify immutable published Airthings image
        if: needs.plan.outputs.package_id == 'airthings-consumer-cloud-api' && inputs.publish
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: >-
          pdm run python scripts/qualify_release_image.py
          --image '${{ needs.plan.outputs.image }}@${{ steps.build.outputs.digest }}'
          --version '${{ needs.plan.outputs.version }}'
          --revision '${{ github.sha }}'
          --manifest-sha256 '${{ steps.contracts.outputs.manifest_sha256 }}'
          --behaviors-sha256 '${{ steps.contracts.outputs.behaviors_sha256 }}'
      - name: Qualify immutable published Sense image
        if: needs.plan.outputs.package_id == 'piphi-network-sense' && inputs.publish
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: >-
          pdm run python scripts/qualify_release_image.py
          --image '${{ needs.plan.outputs.image }}@${{ steps.build.outputs.digest }}'
          --version '${{ needs.plan.outputs.version }}'
          --revision '${{ github.sha }}'
          --manifest-sha256 '${{ steps.contracts.outputs.manifest_sha256 }}'
          --behaviors-sha256 '${{ steps.contracts.outputs.behaviors_sha256 }}'
      - name: Attest published image
        if: inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.plan.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Build platform-neutral Windows Python wheel
        if: needs.plan.outputs.python_wheel == 'true'
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: |
          rm -rf windows-dist
          pdm build --no-sdist --dest windows-dist
          test "$(find windows-dist -maxdepth 1 -name '*-py3-none-any.whl' | wc -l)" -eq 1
      - name: Smoke-test wheel installation
        if: needs.plan.outputs.python_wheel == 'true'
        working-directory: ${{ needs.plan.outputs.app_path }}
        run: |
          python -m venv /tmp/piphi-wheel-smoke
          /tmp/piphi-wheel-smoke/bin/pip install windows-dist/*-py3-none-any.whl
          /tmp/piphi-wheel-smoke/bin/python -c "import piphi_ble_gateway_sidecar; from piphi_ble_gateway_sidecar.scanner import BleakCallbackScanner"
      - name: Attest Windows Python wheel
        if: needs.plan.outputs.python_wheel == 'true' && inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ needs.plan.outputs.app_path }}/windows-dist/*-py3-none-any.whl
      - name: Write immutable release evidence
        run: |
          wheel=""
          wheel_sha256=""
          if [ '${{ needs.plan.outputs.python_wheel }}' = 'true' ]; then
            wheel="$(basename "$(find '${{ needs.plan.outputs.app_path }}/windows-dist' -maxdepth 1 -name '*-py3-none-any.whl' -print -quit)")"
            wheel_sha256="$(sha256sum '${{ needs.plan.outputs.app_path }}/windows-dist/'*-py3-none-any.whl | cut -d' ' -f1)"
          fi
          jq -n \
            --arg package_id '${{ needs.plan.outputs.package_id }}' \
            --arg version '${{ needs.plan.outputs.version }}' \
            --arg image '${{ needs.plan.outputs.image }}' \
            --arg digest '${{ steps.build.outputs.digest }}' \
            --arg source '${{ github.server_url }}/${{ github.repository }}' \
            --arg revision '${{ github.sha }}' \
            --arg wheel "$wheel" \
            --arg wheel_sha256 "$wheel_sha256" \
            '{schema_version:1, package_id:$package_id, version:$version, image:$image, digest:$digest, source:$source, revision:$revision}
             + if $wheel == "" then {} else {windows_python_wheel:$wheel, windows_python_wheel_sha256:$wheel_sha256} end' \
            > release-evidence.json
      - name: Prepare registry cutover proposal
        run: >-
          python scripts/registry_proposal.py
          --package '${{ needs.plan.outputs.package_id }}'
          --version '${{ needs.plan.outputs.version }}'
          --digest '${{ steps.build.outputs.digest }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.package_id }}-${{ needs.plan.outputs.version }}-evidence
          path: |
            release-evidence.json
            registry-proposal.json
            ${{ needs.plan.outputs.app_path }}/windows-dist/*-py3-none-any.whl
      - name: Create namespaced GitHub release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.package_id }} v${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-evidence.json
            registry-proposal.json
            ${{ needs.plan.outputs.app_path }}/windows-dist/*-py3-none-any.whl
          body: |
            Image: `${{ needs.plan.outputs.image }}:${{ needs.plan.outputs.version }}`
            Digest: `${{ steps.build.outputs.digest }}`
            Windows process artifact: platform-neutral Python wheel (when attached)

  verify-external-oci:
    needs: [plan, qualify]
    if: needs.plan.outputs.artifact_kind == 'oci' && needs.plan.outputs.publishing_mode == 'external'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate immutable digest input
        run: |
          [[ '${{ inputs.external_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]
      - name: Verify externally published image is retrievable
        run: >-
          docker buildx imagetools inspect
          '${{ needs.plan.outputs.image }}@${{ inputs.external_digest }}'
      - name: Write external release evidence
        run: |
          jq -n \
            --arg package_id '${{ needs.plan.outputs.package_id }}' \
            --arg version '${{ needs.plan.outputs.version }}' \
            --arg image '${{ needs.plan.outputs.image }}' \
            --arg digest '${{ inputs.external_digest }}' \
            --arg source '${{ github.server_url }}/${{ github.repository }}' \
            --arg revision '${{ github.sha }}' \
            '{schema_version:1, ownership:"external", package_id:$package_id, version:$version, image:$image, digest:$digest, source:$source, revision:$revision}' \
            > release-evidence.json
      - name: Prepare registry cutover proposal
        run: >-
          python scripts/registry_proposal.py
          --package '${{ needs.plan.outputs.package_id }}'
          --version '${{ needs.plan.outputs.version }}'
          --digest '${{ inputs.external_digest }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.package_id }}-${{ needs.plan.outputs.version }}-external-evidence
          path: |
            release-evidence.json
            registry-proposal.json
      - name: Create namespaced GitHub release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.package_id }} v${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-evidence.json
            registry-proposal.json
          body: |
            Externally managed image: `${{ needs.plan.outputs.image }}@${{ inputs.external_digest }}`

  package-non-oci:
    needs: [plan, qualify]
    if: needs.plan.outputs.artifact_kind != 'oci'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.node == 'true'
        with:
          node-version: ${{ needs.plan.outputs.node_version }}
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.python == 'true'
        with:
          python-version: ${{ needs.plan.outputs.python_version }}
      - uses: actions/setup-go@v5
        if: needs.plan.outputs.go == 'true'
        with:
          go-version: ${{ needs.plan.outputs.go_version }}
      - uses: actions/setup-java@v4
        if: needs.plan.outputs.java == 'true'
        with:
          distribution: temurin
          java-version: ${{ needs.plan.outputs.java_version }}
      - uses: actions/setup-dotnet@v4
        if: needs.plan.outputs.dotnet == 'true'
        with:
          dotnet-version: ${{ needs.plan.outputs.dotnet_version }}
      - uses: ruby/setup-ruby@v1
        if: needs.plan.outputs.ruby == 'true'
        with:
          ruby-version: ${{ needs.plan.outputs.ruby_version }}
          bundler-cache: false
      - name: Prepare Rust
        if: needs.plan.outputs.rust == 'true'
        run: rustup toolchain install stable --profile minimal
      - name: Prepare PHP
        if: needs.plan.outputs.php == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli composer
          php -r "exit(version_compare(PHP_VERSION, '${{ needs.plan.outputs.php_version }}', '>=') ? 0 : 1);"
      - name: Prepare Python package tooling
        if: needs.plan.outputs.python == 'true'
        run: python -m pip install "pdm==2.29.7"
      - name: Build release output
        working-directory: ${{ needs.plan.outputs.app_path }}
        env:
          PIPHI_WIDGET_SIGNING_KEY_PEM_BASE64: ${{ secrets.PIPHI_WIDGET_SIGNING_KEY_PEM_BASE64 }}
        run: |
          python "${{ github.workspace }}/scripts/run_release_commands.py" \
            --package "${{ needs.plan.outputs.package_id }}" \
            --version "${{ needs.plan.outputs.version }}"
          test -e "${{ needs.plan.outputs.output }}"
      - name: Archive package output
        run: >-
          tar -C "${{ needs.plan.outputs.app_path }}"
          -czf "${{ needs.plan.outputs.package_id }}-${{ needs.plan.outputs.version }}.tgz"
          "${{ needs.plan.outputs.output }}"
      - name: Write checksum
        run: sha256sum "${{ needs.plan.outputs.package_id }}-${{ needs.plan.outputs.version }}.tgz" > SHA256SUMS
      - name: Prepare registry cutover proposal
        run: >-
          python scripts/registry_proposal.py
          --package '${{ needs.plan.outputs.package_id }}'
          --version '${{ needs.plan.outputs.version }}'
          --digest "sha256:$(sha256sum '${{ needs.plan.outputs.package_id }}-${{ needs.plan.outputs.version }}.tgz' | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.package_id }}-${{ needs.plan.outputs.version }}
          path: |
            ${{ needs.plan.outputs.package_id }}-${{ needs.plan.outputs.version }}.tgz
            SHA256SUMS
            registry-proposal.json
      - name: Create namespaced GitHub release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.package_id }} v${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ needs.plan.outputs.package_id }}-${{ needs.plan.outputs.version }}.tgz
            SHA256SUMS
            registry-proposal.json
