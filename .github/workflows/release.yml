name: Release widget package

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, self-hosted-machine-1]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npm run conformance
      - run: python -m pip install "cryptography==50.0.2"
      - run: npm install --no-save @piphi-network/cli@0.4.1
      - name: Build signed package
        env:
          PIPHI_WIDGET_SIGNING_KEY_PEM_BASE64: ${{ secrets.PIPHI_WIDGET_SIGNING_KEY_PEM_BASE64 }}
        run: >-
          ./node_modules/.bin/piphi widget publish
          --output-dir release
          --key-id piphi-release-2
          --no-registry
      - name: Write checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
