[project]
name = "piphi-wyze-camera-service"
version = "0.1.0"
description = "PiPhi managed service for authorized Wyze camera streams."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23.0,<5.0.0",
  "pytest>=8.0.0,<10.0.0",
  "pytest-asyncio>=0.24.0,<2.0.0",
  "ruff>=0.9.0,<1.0.0"
]

[project.scripts]
piphi_wyze_camera_service = "piphi_wyze_camera_service.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_wyze_camera_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
